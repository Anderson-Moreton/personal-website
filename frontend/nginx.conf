# -----------------------------
# HTTP → HTTPS redirect
# -----------------------------
server {
    listen 80;
    server_name amoreton.dev www.amoreton.dev;

    return 301 https://$host$request_uri;
}

# -----------------------------
# HTTPS main server
# -----------------------------
server {
    listen 443 ssl;
    server_name amoreton.dev www.amoreton.dev;

    ssl_certificate /etc/letsencrypt/live/amoreton.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoreton.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    # Angular build root
    root /usr/share/nginx/html/browser;
    index index.html;

    # -----------------------------
    # Angular SPA (home)
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------
    # Angular SPA (admin routes)
    # -----------------------------
    location /admin {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------
    # Backend API
    # -----------------------------
    location /api/ {
        proxy_pass http://personal_backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------
    # Uploaded images
    # -----------------------------
    location /uploads/ {
        proxy_pass http://personal_backend:3000/uploads/;
    }
}