# -----------------------------
# HTTP → HTTPS redirect
# -----------------------------
server {
    listen 80;
    server_name amoreton.dev www.amoreton.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------
# HTTPS main server
# -----------------------------
server {
    listen 443 ssl;
    server_name amoreton.dev www.amoreton.dev;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/amoreton.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amoreton.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Angular build path
    root /usr/share/nginx/html/browser;
    index index.html;

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Backend
    location /api/ {
        proxy_pass http://personal_backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads → Backend
    location /uploads/ {
        proxy_pass http://personal_backend:3000/uploads/;
    }
}