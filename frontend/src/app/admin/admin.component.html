<div class="main-container d-flex align-items-start">
  <!-- Sidebar -->
  <app-sidebar ></app-sidebar>

  <div class="content">
    <!-- Navbar -->
    <app-navbar></app-navbar>

    <main class="container mt-3">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Admin – Testimonials</h3>
        <button class="btn btn-outline-danger btn-sm" (click)="logout()">
          Logout
        </button>
      </div>

      <!-- Loading -->
      <p *ngIf="loading">Loading...</p>

      <!-- PENDING TESTIMONIALS -->
      <section class="mb-5">
        <h5 class="mb-3">Pending Approval</h5>
        <div *ngIf="!loading && pendingTestimonials.length === 0">
          No pending testimonials.
        </div>
        <div class="row g-3" *ngIf="pendingTestimonials.length > 0">
          <div class="col-md-6 col-lg-4" *ngFor="let t of pendingTestimonials">
            <div class="card h-100">
              <div class="card-body d-flex flex-column">
                <h6>{{ t.first_name }} {{ t.last_name }}</h6>
                <p class="flex-grow-1">
                  {{ t.message }}
                </p>
                <img
                  *ngIf="t.image_url"
                  [src]="'http://localhost:3000' + t.image_url"
                  class="img-fluid rounded mb-2"
                />
                <div class="d-flex justify-content-between mt-2">
                  <button
                    class="btn btn-success btn-sm"
                    (click)="approve(t.id)"
                  >
                    Approve
                  </button>
                  <button
                    class="btn btn-danger btn-sm"
                    (click)="reject(t.id)"
                  >
                    Reject
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- APPROVED TESTIMONIALS -->
      <section>
        <h5 class="mb-3">Approved Testimonials</h5>

        <div *ngIf="approvedTestimonials.length === 0">
          No approved testimonials.
        </div>
        <div class="row g-3" *ngIf="approvedTestimonials.length > 0">
          <div class="col-md-6 col-lg-4" *ngFor="let t of approvedTestimonials">
            <div class="card h-100">
              <div class="card-body d-flex flex-column">
                <h6>{{ t.first_name }} {{ t.last_name }}</h6>
                <p class="flex-grow-1">
                  {{ t.message }}
                </p>
                <img
                  *ngIf="t.image_url"
                  [src]="'http://localhost:3000' + t.image_url"
                  class="img-fluid rounded mb-2"
                />
                <div class="d-flex justify-content-between align-items-center mt-2">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      [checked]="t.show_on_home === 1"
                      (change)="toggleShowOnHome(t.id)"
                    />
                    <label class="form-check-label">
                      Show on Home
                    </label>
                  </div>
                  <button
                    class="btn btn-outline-danger btn-sm"
                    (click)="delete(t.id)"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
