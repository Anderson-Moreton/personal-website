<div class="main-container d-flex align-items-start">
  <app-sidebar></app-sidebar>
  <div class="content">
    <app-navbar></app-navbar>
    <main class="container mt-3">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Admin – Testimonials</h3>
        <button class="btn btn-outline-danger btn-sm" (click)="logout()">
          Logout
        </button>
      </div>
      <p *ngIf="loading">Loading...</p>
      <section class="mb-5">
        <h5 class="mb-3">Pending Approval</h5>
        <div *ngIf="!loading && pendingTestimonials.length === 0">
          No pending testimonials.
        </div>
        <div class="row g-3" *ngIf="pendingTestimonials.length > 0">
          <div class="col-md-6 col-lg-4" *ngFor="let t of pendingTestimonials">
            <div class="card h-100">
              <div class="card-body">
                <h6>{{ t.first_name }} {{ t.last_name }}</h6>
                <p class="small">{{ t.message }}</p>
                <img
                  *ngIf="t.image_url"
                  [src]="'http://localhost:3000' + t.image_url"
                  class="img-fluid rounded mb-2"
                />
                <div class="d-flex justify-content-between mt-3">
                  <button
                    class="btn btn-success btn-sm"
                    (click)="approve(t.id)"
                  >
                    Approve
                  </button>
                  <button
                    class="btn btn-danger btn-sm"
                    (click)="reject(t.id)"
                  >
                    Reject
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section>
        <h5 class="mb-3">All Approved Testimonials</h5>
        <div *ngIf="!loading && approvedTestimonials.length === 0">
          No approved testimonials.
        </div>
        <div class="table-responsive" *ngIf="approvedTestimonials.length > 0">
          <table class="table table-sm table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Message</th>
                <th>Home</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let t of approvedTestimonials">
                <td>
                  {{ t.first_name }} {{ t.last_name }}
                </td>

                <td class="text-truncate" style="max-width: 280px;">
                  {{ t.message }}
                </td>
                <td>
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [checked]="t.show_on_home === 1"
                    (change)="toggleHomeVisibility(t)"
                  />
                </td>
                <td>
                  <button
                    class="btn btn-outline-danger btn-sm"
                    (click)="deleteTestimonial(t.id)"
                  >
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
