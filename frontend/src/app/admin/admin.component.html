<div class="main-container d-flex align-items-start">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Content -->
  <div class="content">
    <app-navbar></app-navbar>

    <main class="container mt-3">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="mb-0">Admin – Pending Testimonials</h3>
          <small class="text-muted">
            Max 8 testimonials can be visible on Home
          </small>
        </div>

        <button
          class="btn btn-outline-danger btn-sm"
          (click)="logout()"
        >
          Logout
        </button>
      </div>

      <!-- Loading -->
      <p *ngIf="loading">Loading...</p>

      <!-- Empty -->
      <div *ngIf="!loading && pendingTestimonials.length === 0">
        No pending testimonials.
      </div>

      <!-- Testimonials -->
      <div class="row g-3" *ngIf="pendingTestimonials.length > 0">
        <div
          class="col-md-6 col-lg-4"
          *ngFor="let t of pendingTestimonials"
        >
          <div class="card h-100 shadow-sm">

            <!-- Image -->
            <img
              *ngIf="t.image_url"
              [src]="'http://localhost:3000' + t.image_url"
              class="card-img-top"
              alt="testimonial image"
            />

            <div class="card-body d-flex flex-column">
              <h5 class="card-title">
                {{ t.first_name }} {{ t.last_name }}
              </h5>

              <p class="card-text flex-grow-1">
                {{ t.message }}
              </p>

              <!-- Show on Home -->
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [checked]="t.show_on_home"
                  (change)="toggleHome(t)"
                  id="showHome{{ t.id }}"
                />
                <label
                  class="form-check-label"
                  for="showHome{{ t.id }}"
                >
                  Show on Home
                </label>
              </div>

              <!-- Actions -->
              <div class="d-flex justify-content-between mt-2">
                <button
                  class="btn btn-success btn-sm"
                  (click)="approve(t.id)"
                >
                  Approve
                </button>

                <button
                  class="btn btn-danger btn-sm"
                  (click)="reject(t.id)"
                >
                  Reject
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>

    </main>
  </div>
</div>
