<div class="main-container d-flex align-items-start">
  <app-sidebar [sidebarActive]="sidebarActive"></app-sidebar>

  <div class="content">
    <app-navbar (toggleSidebarEvent)="sidebarActive = !sidebarActive"></app-navbar>

    <main class="container mt-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Admin – Pending Testimonials</h3>
      </div>

      <p *ngIf="loading">Loading...</p>

      <div *ngIf="!loading && pendingTestimonials.length === 0">No pending testimonials.</div>

      <div class="row g-3" *ngIf="pendingTestimonials.length > 0">
        <div class="col-md-6 col-lg-4" *ngFor="let t of pendingTestimonials">
          <div class="card h-100">
            <div class="card-body">
              <h5>{{ t.first_name }} {{ t.last_name }}</h5>
              <p>{{ t.message }}</p>

              <img
                *ngIf="t.image_url"
                [src]="'http://localhost:3000' + t.image_url"
                class="img-fluid rounded mb-2"
              />

              <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-success" (click)="approve(t.id)">Approve</button>

                <button class="btn btn-danger" (click)="reject(t.id)">Reject</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
