<div class="main-container d-flex align-items-start">
  <app-sidebar [sidebarActive]="sidebarActive"></app-sidebar>

  <div class="content">
    <app-navbar (toggleSidebarEvent)="sidebarActive = !sidebarActive"></app-navbar>

    <main class="container mt-3">
      <h3>Admin – Pending Messages</h3>

      <p *ngIf="loading">Loading...</p>

      <div class="row g-3" *ngIf="!loading && pendingMessages.length > 0">
        <div class="col-md-6 col-lg-4" *ngFor="let msg of pendingMessages">
          <div class="card h-100">
            <div class="card-body">
              <h5>{{ msg.first_name }} {{ msg.last_name }}</h5>
              <p><strong>Topic:</strong> {{ msg.topic }}</p>
              <p>{{ msg.message }}</p>

              <img
                *ngIf="msg.image_url"
                [src]="'http://localhost:3000' + msg.image_url"
                class="img-fluid rounded mb-2"
              />

              <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-success" (click)="approve(msg.id)">Approve</button>
                <button class="btn btn-danger" (click)="reject(msg.id)">Reject</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
