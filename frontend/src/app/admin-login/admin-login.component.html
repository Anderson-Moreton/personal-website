<div class="container mt-5">
  <h3>Admin Login</h3>

  <div class="mb-3">
    <label>Email</label>
    <input type="email" class="form-control" [(ngModel)]="email">
  </div>

  <div class="mb-3">
    <label>Password</label>
    <input type="password" class="form-control" [(ngModel)]="password">
  </div>

  <button class="btn btn-dark" (click)="login()">Login</button>

  <p class="text-danger mt-3" *ngIf="error">{{ error }}</p>
</div>
